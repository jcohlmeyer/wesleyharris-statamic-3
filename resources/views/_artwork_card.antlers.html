<a href="{{ url }}" class="flex flex-col">
    {{ main_photo }}
        <img
            src="{{ glide:url width='475' height='475' fit='crop_focal' }}"
            alt="{{ alt | smartypants | entities }}"
            width="475"
            height="475"
            class="w-full"
            loading="lazy"
            decoding="async"
        />
    {{ /main_photo }}
    <span
        class="
            block flex-grow
            text-white uppercase font-bold
            bg-gray
            p-2 mt-2
        "
    >
        {{ title }}
        {{ if for_sale }}
            <span class="block font-normal text-sm mt-1">${{ price | format_number }} CAD · Canada only</span>
        {{ else }}
            <span class="block font-normal text-sm mt-1">This item has sold</span>
        {{ /if }}
    </span>
</a>
