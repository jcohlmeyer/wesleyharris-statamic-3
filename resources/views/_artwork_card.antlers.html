<a href="{{ url }}">
    {{# Red dot: the gallery convention for a sold work. #}}
    <span class="block relative">
        {{ main_photo }}
            <img
                src="{{ glide:url width='475' height='475' fit='crop_focal' }}"
                alt="{{ alt | smartypants | entities }}"
                width="475"
                height="475"
                class="w-full"
                loading="lazy"
                decoding="async"
            />
        {{ /main_photo }}
        {{ unless for_sale }}
            <span
                role="img"
                aria-label="Sold"
                title="Sold"
                class="
                    absolute top-2 right-2
                    w-3 h-3
                    rounded-full
                    bg-red
                "
            ></span>
        {{ /unless }}
    </span>
    <span
        class="
            block
            text-white uppercase font-bold
            bg-gray
            p-2 mt-2
        "
    >
        {{ title }}
        {{ if for_sale }}
            <span class="block font-normal text-sm mt-1">${{ price | format_number }} CAD · Canada only</span>
        {{ /if }}
    </span>
</a>
