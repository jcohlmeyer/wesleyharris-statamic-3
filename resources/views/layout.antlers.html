<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ title ?? site:name }}</title>
        <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
        <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)">
        <link rel="stylesheet" type="text/css" href="https://cloud.typography.com/7670432/7383232/css/fonts.css" />
        <link rel="stylesheet" href="{{ mix src='css/tailwind.css' }}">
        <noscript><style>#main-menu, #submenu { display: block !important; } [data-menu-toggle] { display: none !important; }</style></noscript>
    </head>
    <body class="font-gotham text-black font-normal background-white">
        {{ partial:header }}
        <div class="mx-auto px-4 max-w-7xl">
            {{ template_content }}
        </div>
        {{ partial:footer }}
        <script src="{{ mix src='/js/site.js' }}"></script>
    </body>
</html>
